<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Canasta</title>
<link rel="stylesheet" href="./css/style.css" />
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<header class="topbar">
  <h1>Canasta</h1>
  <div class="scores">
    <span>P1 <b id="score-p1">0</b></span>
    <span>P2 <b id="score-p2">0</b></span>
  </div>
  <div class="actions">
    <button id="btn-new-round" type="button">Nueva mano</button>
    <button id="btn-new-game" type="button" class="secondary">Reset</button>
    <button id="btn-leave" type="button" class="secondary">Salir</button>
  </div>
</header>

<main id="board">
  <section class="player" id="player-2">
    <div class="player-head">
      <h2>Jugador 2</h2>
      <span class="meta" id="meta-p2"></span>
    </div>
    <div class="melds" id="melds-p2"></div>
    <div class="hand" id="hand-p2"></div>
  </section>

  <section class="middle">
    <div class="pile stock" id="stock">
      <div class="pile-label">Mazo</div>
      <div class="pile-count" id="stock-count">0</div>
    </div>
    <div class="pile discard" id="discard">
      <div class="pile-label">Pozo</div>
      <div class="pile-top" id="discard-top"></div>
      <div class="pile-count" id="discard-count">0</div>
      <div class="pile-frozen" id="discard-frozen" hidden>congelado</div>
    </div>
    <div class="turn-info">
      <div id="turn-label">—</div>
      <div id="phase-label" class="muted">—</div>
      <div id="message" class="msg"></div>
    </div>
  </section>

  <section class="player" id="player-1">
    <div class="player-head">
      <h2>Jugador 1</h2>
      <span class="meta" id="meta-p1"></span>
    </div>
    <div class="melds" id="melds-p1"></div>
    <div class="hand" id="hand-p1"></div>
    <div class="hand-actions">
      <button id="btn-draw-stock" type="button">Robar mazo</button>
      <button id="btn-take-discard" type="button">Tomar pozo</button>
      <button id="btn-meld" type="button">Bajar</button>
      <button id="btn-add-meld" type="button">Agregar</button>
      <button id="btn-discard" type="button">Descartar</button>
      <button id="btn-go-out" type="button">Cortar</button>
    </div>
  </section>
</main>

<!-- Lobby modal -->
<div id="lobby" class="lobby" hidden>
  <div class="lobby-card">
    <h2>Canasta · 1v1</h2>
    <p class="muted">Elegí cómo jugar</p>

    <div class="lobby-section">
      <button id="btn-mode-local" type="button" class="big">Jugar local (mismo dispositivo)</button>
    </div>

    <div class="lobby-divider"><span>o jugá online (P2P)</span></div>

    <div class="lobby-section">
      <button id="btn-mode-host" type="button" class="big">Crear partida</button>
      <div id="room-code-box" class="room-code" hidden>
        <div class="muted">Compartí este código con tu rival:</div>
        <div class="code-row">
          <span id="room-code-show" class="room-code-text">------</span>
          <button id="btn-copy-code" type="button" class="secondary">Copiar</button>
        </div>
      </div>
    </div>

    <div class="lobby-section">
      <div class="join-row">
        <input id="code-input" type="text" placeholder="CÓDIGO" maxlength="8"
               autocomplete="off" autocorrect="off" autocapitalize="characters" />
        <button id="btn-mode-client" type="button">Unirse</button>
      </div>
    </div>

    <div id="lobby-msg" class="lobby-msg"></div>
    <div class="lobby-foot muted">
      Para jugar online necesitás 2 dispositivos (o 2 pestañas).<br/>
      Sin servidor: conexión directa vía WebRTC.
    </div>
  </div>
</div>

<script type="module" src="./js/ui/main.js"></script>
</body>
</html>
